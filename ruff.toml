# Lint config for Reelarr. `ruff check .` must pass in CI.
target-version = "py310"
line-length = 140
extend-exclude = ["tools/build_places.py"]

[lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "B",             # bugbear: likely bugs
    "S",             # bandit: security
    "UP",            # pyupgrade
    "PIE", "C4",     # small correctness/clarity checks
    "RUF",           # ruff's own checks
    "PLW",           # pylint warnings
]
ignore = [
    "E402", "E731", "E741", "E702",   # style only: short names, one-liners
    "S603", "S607",   # ffmpeg/ffprobe/7z run by name with argument lists, never a shell
    "S310",           # urlopen only on fixed https:// service URLs
    "S324",           # SHA-1/MD5 for torrent infohashes and .md5 checksums, not security
    "S110", "S112",   # the try/except/pass left are deliberate soft fallbacks (reviewed)
    "RUF001", "RUF002", "RUF003",     # typographic quotes and dashes in user-facing text
    "PLW0603",        # module-level caches and the scheduler singleton
    "B905",           # zip() over lists built side by side
    "PLW2901",        # normalising a loop variable in place (t = t.strip()) is intended
]

[lint.per-file-ignores]
"tests/*" = ["E501", "S101", "S105", "S106", "S108", "S603", "PLW1510", "RUF012"]
"app/main.py" = ["B008"]    # FastAPI's Body(...) defaults are the documented idiom
