# Lint and test every push and pull request; build the image; publish it to
# GitHub Container Registry as ghcr.io/<owner>/reelarr.
#
#   push a tag v0.1.0   → :0.1.0, :0.1, :latest
#   push to main        → :edge
#   pull requests       → lint, test and build only — nothing published
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Type check
        run: mypy
      - name: JavaScript syntax
        run: for f in app/static/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # a stuck runner fails fast instead of hanging for hours
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg p7zip-full
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Prove the image starts and answers before anything is published.
      - name: Build for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: reelarr:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8189:8189 reelarr:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8189/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8189/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8189/login | grep -q 200
          test "$(docker exec smoke stat -c %u /proc/1)" != "0"   # the app itself isn't root
      - name: Container logs (on failure)
        if: failure()
        run: docker logs smoke 2>&1 | tail -100

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/reelarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Anyone can pull it (no login)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker logout ghcr.io
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/reelarr:${{ github.ref == 'refs/heads/main' && 'edge' || github.ref_name }}"
          image="${image/:v/:}"
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "::error::$image can't be pulled without logging in. On GitHub: your profile → Packages → reelarr → Package settings → Change visibility → Public."
            exit 1
          fi
          echo "$image is public"
