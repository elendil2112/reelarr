name: Feature idea
description: Something Reelarr could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in your collection or workflow, rather than the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: else
    attributes:
      label: Anything you do today instead?
